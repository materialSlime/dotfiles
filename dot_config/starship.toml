# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

# Inserts a blank line between shell prompts
add_newline = true

# Cyberpunk HUD theme
#   ┌─[neo]─[~/.config]─[ main]─[✎]──────────────[08:10 AM]
#   └─[3s]─❯
# Frame and brackets are `primary`. Each module draws its own "─[ ]",
# so a module that has nothing to show leaves no empty brackets behind.

palette = "cyberpunk"

format = """
[┌─](fg:primary)\
$username\
$directory\
$git_branch\
$git_status\
$python\
$nodejs\
$fill\
$time\
\n\
[└─](fg:primary)\
${custom.sudo}\
$cmd_duration\
$character"""

# Palette is generated from ~/.config/theme/palette by ~/.config/theme/build
# >>> theme-build palette >>>
# Generated by ~/.config/theme/build from ~/.config/theme/palette. Do not edit.
[palettes.cyberpunk]
bg = "#0E0E17"
primary = "#F75049"
secondary = "#5EF6FF"
accent = "#F3E900"
text = "#CDD6F4"
muted = "#646478"
surface = "#1A1B2E"
tertiary = "#246DCE"
bright = "#FFFFFF"
ansi_magenta = "#FF00FF"
ansi_purple = "#9D4EDD"
bg_dark = "#0A0A10"
primary_dim = "#A53938"
secondary_dim = "#2A5F68"
# <<< theme-build palette <<<

# --- Module Configurations ---

# Frame line between the left modules and the time
[fill]
symbol = "─"
style = "fg:primary"

# Username: accent; root gets a filled red block so it can't be missed
[username]
style_user = "bold fg:accent"
style_root = "bold bg:primary fg:bg"
format = "[\\[](fg:primary)[$user]($style)[\\]](fg:primary)"
show_always = true

# Directory: secondary
[directory]
style = "fg:secondary"
read_only = " 󰌾"
read_only_style = "fg:primary"
format = "[─\\[](fg:primary)[$path]($style)[$read_only]($read_only_style)[\\]](fg:primary)"
truncation_length = 3
truncate_to_repo = false
home_symbol = "󰋜"

# Special folders show as just an icon (~/Music -> 󰝚, ~/Music/x -> 󰝚/x).
# Keys start at home, so only ~/Music gets an icon,
# not some other folder that happens to be called Music deeper down.
[directory.substitutions]
"󰋜/.config" = "󰒓"
"󰋜/Desktop" = "󰇄"
"󰋜/Documents" = "󰈙"
"󰋜/Downloads" = "󰇚"
"󰋜/Music" = "󰝚"
"󰋜/Pictures" = "󰉏"
"󰋜/Videos" = "󰕧"
"󰋜/Projects" = "󰅩"
"󰋜/Games" = "󰊔"
"󰋜/Saved Games" = "󰊔"
"󰋜/Templates" = "󰆏"
"󰋜/Arduino" = "󰘚"
"󰋜/AppImages" = "󰀻"
"󰋜/Shared" = "󰉌"

# Git branch: primary
[git_branch]
symbol = ""
style = "fg:primary"
format = "[─\\[](fg:primary)[$symbol $branch]($style)[\\]](fg:primary)"

# Git status: only shown when there is something to report
[git_status]
style = "fg:accent"
format = "([─\\[](fg:primary)[$all_status$ahead_behind]($style)[\\]](fg:primary))"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "◼"
stashed = "⚑"
modified = "✎"
staged = "✓"
renamed = "➜"
deleted = "✖"

# Language versions: only shown inside matching projects
[python]
symbol = " "
style = "fg:tertiary"
format = "[─\\[](fg:primary)[$symbol$version]($style)[\\]](fg:primary)"
pyenv_version_name = false

[nodejs]
symbol = "⬢ "
style = "fg:secondary"
format = "[─\\[](fg:primary)[$symbol$version]($style)[\\]](fg:primary)"

# Time at the end of the frame line
[time]
disabled = false
time_format = "%I:%M %p"
style = "fg:text"
format = "[\\[](fg:primary)[$time]($style)[\\]](fg:primary)"

# Sudo cached indicator - shows ⚡ when sudo credentials are active
[custom.sudo]
command = "echo '⚡'"
format = "[\\[](fg:primary)[$output](bold fg:accent)[\\]─](fg:primary)"
when = "sudo -n true 2>/dev/null"

# Command duration: only for commands slower than 2s
[cmd_duration]
min_time = 2000
show_milliseconds = false
format = "[\\[](fg:primary)[$duration](fg:accent)[\\]─](fg:primary)"

# Prompt symbol: secondary, primary after a failed command, accent in vi normal mode
[character]
success_symbol = "[❯](bold fg:secondary)"
error_symbol = "[❯](bold fg:primary)"
vicmd_symbol = "[❯](bold fg:accent)"
