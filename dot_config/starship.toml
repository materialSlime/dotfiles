# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

# Inserts a blank line between shell prompts
add_newline = true

# Cyberpunk theme

palette = "cyberpunk"

format = """
[┌─](bold fg:cyber_orange)\
$username\
[](fg:cyber_orange bg:cyber_red)\
$directory\
$git_branch\
$git_status\
$python\
$nodejs\
${custom.net}\
$fill\
$time\
\n\
[└─](bold fg:cyber_orange)\
${custom.sudo}\
$cmd_duration\
$character
"""

# Define color palette - change values here to update theme everywhere
[palettes.cyberpunk]
cyber_orange = "#FB932A"
cyber_red = "#E20342"
cyber_blue = "#246DCE"
cyber_cyan = "#28F2F4"
cyber_yellow = "#ECEB1E"

# --- Module Configurations ---

# Fill module - pushes content after it to the right edge
[fill]
symbol = " "

# Username with cyber red background and cyan foreground
[username]
style_user = "bg:cyber_orange fg:#000000"
style_root = "bg:#5EF6FF fg:#000000"
format = "[ $user ]($style)"
show_always = true

# Directory path with cyber magenta background and cyan foreground
[directory]
style = "bg:cyber_red fg:cyber_cyan"
format = "[ $path ]($style)"
truncation_length = 3
truncate_to_repo = false
home_symbol = ""


# Git branch - cyberpunk magenta
[git_branch]
symbol = ""
style = "fg:cyber_cyan bg:#E54E32"
format = "[ $symbol $branch ]($style)"

# Git status - cyberpunk red
[git_status]
style = "fg:cyber_red"
format = "[ $all_status$ahead_behind ]($style)"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "◼ "
stashed = "⚑"
modified = "✎"
staged = "✓"
renamed = "➜"
deleted = "✖"

# Python - cyberpunk red/pink
[python]
symbol = ""
style = "fg:#0572B2"
format = "[ $symbol ${version} ]($style)"
disabled = false
pyenv_version_name = false

# Node.js - cyberpunk cyan
[nodejs]
symbol = "⬢ "
style = "fg:cyber_cyan"
format = "[ $symbol(${version} ) ]($style)"
disabled = false

# Command input field styling
[character]
success_symbol = "[❯](bold fg:cyber_cyan)"
error_symbol = "[❯](bold fg:cyber_red)"
vicmd_symbol = "[❯](bold fg:cyber_yellow)"



# Custom command module for network interface - cyberpunk orange
[custom.net]
command = "ip route | grep default | awk '{print $5}' | head -1"
format = "[ \\[$output\\] ](fg:cyber_orange)"
when = "true"
disabled = false

# Sudo cached indicator - shows ⚡ when sudo credentials are active
[custom.sudo]
command = "echo '⚡'"
format = "[$output](bold fg:cyber_yellow) "
when = "sudo -n true 2>/dev/null"
disabled = false

# Time module - cyberpunk yellow
[time]
format = "[\\[$time\\]]($style) "
time_format = "%I:%M %p"
style = "fg:cyber_orange"
disabled = false

# Command duration - cyberpunk yellow
[cmd_duration]
min_time = 2000
format = "[ took $duration ](fg:cyber_yellow)"
disabled = false
show_milliseconds = false
