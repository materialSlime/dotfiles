<svg xmlns="http://www.w3.org/2000/svg" width="120" height="60" viewBox="0 0 120 60">
  <!-- "Tab" 9-slice notification card for swaync and swayosd, drawn 1:1.
       border-image-slice 12 10 10 44, width 12px 10px 10px 44px (left is wide so the tab fits;
       use border-width 12px 10px 10px 10px). Recolored by ~/.config/theme/build (SVG_COLORS). -->
  <path d="M 0.5,6.5 H 119.5 V 59.5 H 0.5 Z" style="fill:#0e0f18;stroke:#c7373e;stroke-width:1;stroke-opacity:0.45"/>
  <!-- angled tab on the top edge -->
  <path d="M 0,0 H 34 L 40,6 H 0 Z" style="fill:#c7373e"/>
