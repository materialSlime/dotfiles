<svg xmlns="http://www.w3.org/2000/svg" width="120" height="60" viewBox="0 0 120 60">
  <!-- 9-slice notification card for swaync (border-image-slice: 10, drawn 1:1). Details stay
       inside the outer 10px. Recolored by ~/.config/theme/build (SVG_COLORS). -->
  <!-- card: thin dim outline, cut top-left and bottom-right corners -->
  <path d="M 8.5,0.5 H 119.5 V 51.5 L 111.5,59.5 H 0.5 V 8.5 Z"
        style="fill:#0e0f18;stroke:#c7373e;stroke-width:1;stroke-opacity:0.55"/>
  <!-- bracket on the cut top-left corner -->
  <path d="M 0,10 V 8 L 8,0 H 10 V 2 H 8.8 L 2,8.8 V 10 Z" style="fill:#c7373e"/>
  <!-- tick on the cut bottom-right corner -->
  <path d="M 120,50 V 52 L 112,60 H 110 Z" style="fill:#c7373e"/>
</svg>
