<svg xmlns="http://www.w3.org/2000/svg" width="120" height="40" viewBox="0 0 120 40">
  <!-- 9-slice search field for wofi #input (border-image-slice: 10, drawn 1:1). Details stay
       inside the outer 10px. Recolored by ~/.config/theme/build (SVG_COLORS). -->
  <!-- field: thin dim outline, cut top-left and bottom-right corners -->
  <path d="M 6.5,0.5 H 119.5 V 33.5 L 113.5,39.5 H 0.5 V 6.5 Z"
        style="fill:#1a1b2e;stroke:#c7373e;stroke-width:1;stroke-opacity:0.6"/>
  <!-- bracket on the cut top-left corner -->
  <path d="M 0,10 V 6 L 6,0 H 10 V 2 H 6.8 L 2,6.8 V 10 Z" style="fill:#c7373e"/>
  <!-- tick on the cut bottom-right corner -->
  <path d="M 120,32 V 34 L 114,40 H 112 Z" style="fill:#c7373e"/>
</svg>
