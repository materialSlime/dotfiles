<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160">
  <!-- "Stepped lip" 9-slice frame for wofi menus and the swaync control center, drawn at
       half size. border-image-slice 40 40 40 88 (top right bottom left), width 20 20 20 44px:
       the left slice is wider so the step in the top edge and the cyan trace fit in it.
       Middle of each edge is a plain line so it stretches cleanly.
       Recolored by ~/.config/theme/build (SVG_COLORS). -->
  <!-- panel: top edge steps down on the left, cut bottom-left corner -->
  <path d="M 4,18 H 62 L 76,4 H 156 V 156 H 20 L 4,140 Z"
        style="fill:#0e0f18;stroke:#c7373e;stroke-width:6;stroke-linejoin:miter"/>
  <!-- circuit trace ending in a pad -->
  <path d="M 14,30 H 56" style="fill:none;stroke:#5ef6ff;stroke-width:2"/>
  <circle cx="61" cy="30" r="4" style="fill:none;stroke:#5ef6ff;stroke-width:2"/>
</svg>
