# ╔══════════════════════════════════════════════════════════════════════════╗
# ║                     CYBERPUNK HYPRLOCK THEME                           ║
# ║  Color palette matched to Hyprland + Waybar cyberpunk theme            ║
# ║                                                                        ║
# ║  LAYOUT: Split — Left column (clock/user/input)                        ║
# ║                   Right column (system controls)                       ║
# ║                   Bottom center (media player)                         ║
# ║                                                                        ║
# ║  PALETTE:                                                              ║
# ║    Background  : #0e0f18  (deep void black)                            ║
# ║    Cyan/Aqua   : #28F2F4  (neon cyan — primary accent)                 ║
# ║    Yellow      : #ECEB1E  (neon yellow — highlight)                    ║
# ║    Red         : #C7373E  (alert red — warnings)                       ║
# ║    Blue        : #246DCE  (deep blue — secondary)                      ║
# ║                                                                        ║
# ║  EMERGENCY RESTORE:                                                    ║
# ║    bash ~/.config/hypr/backups/restore-hyprlock.sh                     ║
# ╚══════════════════════════════════════════════════════════════════════════╝

# ── BACKGROUND ─────────────────────────────────────────────────────────────
background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 5
    noise = 0.02
    contrast = 0.75
    brightness = 0.45
    vibrancy = 0.3
    vibrancy_darkness = 0.5
}

# ── GENERAL ────────────────────────────────────────────────────────────────
general {
    no_fade_in = false
    grace = 0
    disable_loading_bar = false
}

# ══════════════════════════════════════════════════════════════════════════
#   LEFT COLUMN — Clock, Date, User, Input
#   All elements: halign = left, x offset = 100
# ══════════════════════════════════════════════════════════════════════════

# ── Decorative top accent for left panel ──
label {
    monitor =
    text = ┌── SYSTEM :: ENCRYPTED ──────────────────────
    color = rgba(199, 55, 62, 0.5)
    font_size = 12
    font_family = JetBrainsMono Nerd Font Mono
    position = 80, -50
    halign = left
    valign = top
}

# ── Hours — large neon yellow ──
label {
    monitor =
    text = cmd[update:1000] echo "<span>$(date +"%I")</span>"
    color = rgba(236, 235, 30, 1)
    font_size = 160
    font_family = Rajdhani Bold
    position = 80, 240
    halign = left
    valign = center
}

# ── Colon — red separator ──
label {
    monitor =
    text = cmd[update:1000] echo "<span>:</span>"
    color = rgba(199, 55, 62, 0.9)
    font_size = 130
    font_family = Rajdhani Bold
    position = 275, 245
    halign = left
    valign = center
}

# ── Minutes — neon cyan ──
label {
    monitor =
    text = cmd[update:1000] echo "<span>$(date +"%M")</span>"
    color = rgba(40, 242, 244, 1)
    font_size = 160
    font_family = Rajdhani Bold
    position = 320, 240
    halign = left
    valign = center
}

# ── Seconds ──
label {
    monitor =
    text = cmd[update:1000] echo "<span>$(date +"%S")</span>"
    color = rgba(40, 242, 244, 0.35)
    font_size = 28
    font_family = JetBrainsMono Nerd Font Mono
    position = 545, 280
    halign = left
    valign = center
}

# ── AM/PM ──
label {
    monitor =
    text = cmd[update:1000] echo "<span>$(date +"%p")</span>"
    color = rgba(199, 55, 62, 0.7)
    font_size = 18
    font_family = Rajdhani Bold
    position = 545, 220
    halign = left
    valign = center
}

# ── Date ──
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A  //  %d %B %Y")"
    color = rgba(40, 242, 244, 0.5)
    font_size = 20
    font_family = Rajdhani Bold
    position = 100, 95
    halign = left
    valign = center
}

# ── Separator ──
label {
    monitor =
    text = ─────────────────────────────────────
    color = rgba(40, 242, 244, 0.12)
    font_size = 10
    font_family = JetBrainsMono Nerd Font Mono
    position = 90, 65
    halign = left
    valign = center
}

# ── Username ──
label {
    monitor =
    text = $USER
    color = rgba(40, 242, 244, 0.9)
    outline_thickness = 0
    font_size = 28
    font_family = Rajdhani Bold
    position = 100, -10
    halign = left
    valign = center
}

# ── User role tag ──
label {
    monitor =
    text = SAMURAI
    color = rgba(36, 109, 206, 0.5)
    font_size = 12
    font_family = JetBrainsMono Nerd Font Mono
    position = 100, -42
    halign = left
    valign = center
}

# ── Input Field ──
input-field {
    monitor =
    size = 400, 55
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.25
    dots_center = true
    outer_color = rgba(199, 55, 62, 0.8)
    inner_color = rgba(14, 15, 24, 0.85)
    font_color = rgba(40, 242, 244, 1)
    fade_on_empty = false
    font_family = Rajdhani Bold
    placeholder_text = <i><span foreground="##C7373E">▸ ACCESS_REQUIRED</span></i>
    hide_input = false
    check_color = rgba(236, 235, 30, 0.8)
    fail_color = rgba(199, 55, 62, 1)
    fail_text = <i><span foreground="##C7373E">✘ ACCESS_DENIED</span></i>
    fail_timeout = 2000
    capslock_color = rgba(236, 235, 30, 1)
    numlock_color = rgba(36, 109, 206, 0.8)
    bothlock_color = rgba(199, 55, 62, 1)
    position = 100, -110
    halign = left
    valign = center
    rounding = 3
}

# ── Left panel bottom accent ──
label {
    monitor =
    text = └────────────────────────────────────────────
    color = rgba(40, 242, 244, 0.15)
    font_size = 12
    font_family = JetBrainsMono Nerd Font Mono
    position = 80, -180
    halign = left
    valign = center
}

# ══════════════════════════════════════════════════════════════════════════
#   RIGHT COLUMN — System Controls (stacked vertically)
#   All elements: halign = right, x offset = -100
# ══════════════════════════════════════════════════════════════════════════

# ── Right panel top accent ──
label {
    monitor =
    text = ── SYS.CTRL ──┐
    color = rgba(199, 55, 62, 0.4)
    font_size = 12
    font_family = JetBrainsMono Nerd Font Mono
    position = -80, 0
    halign = right
    valign = center
}

# ── Suspend ──
label {
    monitor =
    text = 󰒲   SLEEP
    color = rgba(40, 242, 244, 0.8)
    font_size = 18
    font_family = Rajdhani Bold
    position = -100, -50
    halign = right
    valign = center
    onclick = systemctl suspend
}

label {
    monitor =
    text = ┊
    color = rgba(40, 242, 244, 0.12)
    font_size = 12
    font_family = JetBrainsMono Nerd Font Mono
    position = -80, -80
    halign = right
    valign = center
}

# ── Logout ──
label {
    monitor =
    text = 󰍃   LOGOUT
    color = rgba(236, 235, 30, 0.8)
    font_size = 18
    font_family = Rajdhani Bold
    position = -100, -110
    halign = right
    valign = center
    onclick = uwsm stop
}

label {
    monitor =
    text = ┊
    color = rgba(40, 242, 244, 0.12)
    font_size = 12
    font_family = JetBrainsMono Nerd Font Mono
    position = -80, -140
    halign = right
    valign = center
}

# ── Reboot ──
label {
    monitor =
    text = 󰑓   REBOOT
    color = rgba(236, 235, 30, 0.8)
    font_size = 18
    font_family = Rajdhani Bold
    position = -100, -170
    halign = right
    valign = center
    onclick = systemctl reboot
}

label {
    monitor =
    text = ┊
    color = rgba(40, 242, 244, 0.12)
    font_size = 12
    font_family = JetBrainsMono Nerd Font Mono
    position = -80, -200
    halign = right
    valign = center
}

# ── Shutdown ──
label {
    monitor =
    text = 󰐥   SHUTDOWN
    color = rgba(199, 55, 62, 0.9)
    font_size = 18
    font_family = Rajdhani Bold
    position = -100, -230
    halign = right
    valign = center
    onclick = systemctl poweroff
}

# ── Right panel bottom accent ──
label {
    monitor =
    text = ──────────────┘
    color = rgba(40, 242, 244, 0.15)
    font_size = 12
    font_family = JetBrainsMono Nerd Font Mono
    position = -80, -275
    halign = right
    valign = center
}

# ══════════════════════════════════════════════════════════════════════════
#   BOTTOM CENTER — Media Player
# ══════════════════════════════════════════════════════════════════════════

# ── Album Art ──
image {
    monitor =
    path = /tmp/hyprlock_album_art.png
    size = 65
    rounding = 8
    border_size = 2
    border_color = rgba(40, 242, 244, 0.3)
    position = 0, 120
    halign = center
    valign = bottom
    reload_time = 2
    reload_cmd = ~/.config/hypr/Scripts/album-art.sh
}

# ── Song info (icon + title + artist) — click to play/pause ──
label {
    monitor =
    text = cmd[update:1000] echo "$(~/.config/hypr/Scripts/songdetail.sh icon)  $(~/.config/hypr/Scripts/songdetail.sh)"
    color = rgba(40, 242, 244, 0.8)
    font_size = 15
    font_family = Rajdhani Bold
    position = 0, 50
    halign = center
    valign = bottom
    onclick = playerctl play-pause
}

# ── Player source ──
label {
    monitor =
    text = cmd[update:1000] echo "$(~/.config/hypr/Scripts/songdetail.sh player_name)"
    color = rgba(36, 109, 206, 0.4)
    font_size = 10
    font_family = JetBrainsMono Nerd Font Mono
    position = 0, 33
    halign = center
    valign = bottom
}

# ══════════════════════════════════════════════════════════════════════════
#   BOTTOM — Data Feed Ticker
# ══════════════════════════════════════════════════════════════════════════

label {
    monitor =
    text = cmd[update:10000] echo "▸ $(~/.config/hypr/Scripts/cyber-datafeed.sh)"
    color = rgba(36, 109, 206, 0.35)
    font_size = 11
    font_family = JetBrainsMono Nerd Font Mono
    position = 0, 8
    halign = center
    valign = bottom
}

# ── Corner decorative elements ──
label {
    monitor =
    text = ┌─
    color = rgba(199, 55, 62, 0.25)
    font_size = 16
    font_family = JetBrainsMono Nerd Font Mono
    position = 40, -30
    halign = left
    valign = top
}

label {
    monitor =
    text = ─┐
    color = rgba(199, 55, 62, 0.25)
    font_size = 16
    font_family = JetBrainsMono Nerd Font Mono
    position = -40, -30
    halign = right
    valign = top
}

label {
    monitor =
    text = └─
    color = rgba(40, 242, 244, 0.2)
    font_size = 16
    font_family = JetBrainsMono Nerd Font Mono
    position = 40, 10
    halign = left
    valign = bottom
}

label {
    monitor =
    text = ─┘
    color = rgba(40, 242, 244, 0.2)
    font_size = 16
    font_family = JetBrainsMono Nerd Font Mono
    position = -40, 10
    halign = right
    valign = bottom
}
