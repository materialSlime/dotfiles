# ╔══════════════════════════════════════════════════════════════════════════╗
# ║                     CYBERPUNK HYPRLOCK THEME                           ║
# ║                                                                        ║
# ║  LAYOUT: Center      — big clock, date, user + password                ║
# ║          Bottom dock — now playing (left), system controls (right)     ║
# ║                                                                        ║
# ║  PALETTE:                                                              ║
# ║    Colors come from ~/.config/theme/palette (see gen/colors.conf)      ║
# ║    rgba($c_<name>, alpha)  /  pango markup: foreground='$x_<name>'     ║
# ║                                                                        ║
# ║  MEDIA: Scripts/album-art.sh (square cover), songdetail.sh, active-player.sh ║
# ║  The SDDM theme (~/.config/theme/sddm/Main.qml) mirrors this layout.   ║
# ║                                                                        ║
# ║  EMERGENCY RESTORE:                                                    ║
# ║    bash ~/.config/hypr/backups/restore-hyprlock.sh                     ║
# ╚══════════════════════════════════════════════════════════════════════════╝

source = /home/neo/.config/theme/gen/colors.conf

# ── BACKGROUND ─────────────────────────────────────────────────────────────
background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 5
    noise = 0.02
    contrast = 0.75
    brightness = 0.45
    vibrancy = 0.3
    vibrancy_darkness = 0.5
}

general {
}

# ── Top-left header ──
label {
    monitor =
    text = ┌── SYSTEM :: ENCRYPTED ──────────────────────
    color = rgba($c_primary, 0.5)
    font_size = 12
    font_family = JetBrainsMono Nerd Font Mono
    position = 80, -50
    halign = left
    valign = top
}

# ══════════════════════════════════════════════════════════════════════════
#   CENTER — Clock, date, user + password
# ══════════════════════════════════════════════════════════════════════════

# ── Clock ─────────────────────────────────────────────────────────────────
# Fixed-width digits (Scripts/clock.sh): the frame always lays out 88:88 with
# invisible digits, so its width never changes; each real digit is its own
# label centered on its slot. At 1080p every digit slot is 115.6 px and HH:MM
# spans x = -249 … +249, the same span as the username + password row below.
# The frame is shifted +27 px because the seconds hang off its right side.
label {
    monitor =
    text = cmd[update:1000] ~/.config/hypr/Scripts/clock.sh frame
    color = rgba($c_secondary, 1)
    font_size = 160
    font_family = Rajdhani Bold
    position = 27, 170
    halign = center
    valign = center
}

# ── Digits — generated from Rajdhani's metrics (slot 115.6 px, HH:MM -248.9 … 248.9) ──
# Hour tens: one label per possible value (0/1), ink flush with the left edge.

label {  # hour tens = 0
    monitor =
    text = cmd[update:1000] ~/.config/hypr/Scripts/clock.sh 1 0
    color = rgba($c_secondary, 1)
    font_size = 160
    font_family = Rajdhani Bold
    position = -203, 170
    halign = center
    valign = center
}

label {  # hour tens = 1
    monitor =
    text = cmd[update:1000] ~/.config/hypr/Scripts/clock.sh 1 1
    color = rgba($c_secondary, 1)
    font_size = 160
    font_family = Rajdhani Bold
    position = -218, 170
    halign = center
    valign = center
}

# Middle digits: centered in their slots.

label {  # hour ones
    monitor =
    text = cmd[update:1000] ~/.config/hypr/Scripts/clock.sh 2
    color = rgba($c_secondary, 1)
    font_size = 160
    font_family = Rajdhani Bold
    position = -75, 170
    halign = center
    valign = center
}

label {  # minute tens
    monitor =
    text = cmd[update:1000] ~/.config/hypr/Scripts/clock.sh 3
    color = rgba($c_secondary, 1)
    font_size = 160
    font_family = Rajdhani Bold
    position = 75, 170
    halign = center
    valign = center
}

# Minute ones: one label per value, ink flush with the right edge.

label {  # minute ones = 0
    monitor =
    text = cmd[update:1000] ~/.config/hypr/Scripts/clock.sh 4 0
    color = rgba($c_secondary, 1)
    font_size = 160
    font_family = Rajdhani Bold
    position = 203, 170
    halign = center
    valign = center
}

label {  # minute ones = 1
    monitor =
    text = cmd[update:1000] ~/.config/hypr/Scripts/clock.sh 4 1
    color = rgba($c_secondary, 1)
    font_size = 160
    font_family = Rajdhani Bold
    position = 227, 170
    halign = center
    valign = center
}

label {  # minute ones = 2
    monitor =
    text = cmd[update:1000] ~/.config/hypr/Scripts/clock.sh 4 2
    color = rgba($c_secondary, 1)
    font_size = 160
    font_family = Rajdhani Bold
    position = 206, 170
    halign = center
    valign = center
}

label {  # minute ones = 3
    monitor =
    text = cmd[update:1000] ~/.config/hypr/Scripts/clock.sh 4 3
    color = rgba($c_secondary, 1)
    font_size = 160
    font_family = Rajdhani Bold
    position = 206, 170
    halign = center
    valign = center
}

label {  # minute ones = 4
    monitor =
    text = cmd[update:1000] ~/.config/hypr/Scripts/clock.sh 4 4
    color = rgba($c_secondary, 1)
    font_size = 160
    font_family = Rajdhani Bold
    position = 194, 170
    halign = center
    valign = center
}

label {  # minute ones = 5
    monitor =
    text = cmd[update:1000] ~/.config/hypr/Scripts/clock.sh 4 5
    color = rgba($c_secondary, 1)
    font_size = 160
    font_family = Rajdhani Bold
    position = 204, 170
    halign = center
    valign = center
}

label {  # minute ones = 6
    monitor =
    text = cmd[update:1000] ~/.config/hypr/Scripts/clock.sh 4 6
    color = rgba($c_secondary, 1)
    font_size = 160
    font_family = Rajdhani Bold
    position = 203, 170
    halign = center
    valign = center
}

label {  # minute ones = 7
    monitor =
    text = cmd[update:1000] ~/.config/hypr/Scripts/clock.sh 4 7
    color = rgba($c_secondary, 1)
    font_size = 160
    font_family = Rajdhani Bold
    position = 207, 170
    halign = center
    valign = center
}

label {  # minute ones = 8
    monitor =
    text = cmd[update:1000] ~/.config/hypr/Scripts/clock.sh 4 8
    color = rgba($c_secondary, 1)
    font_size = 160
    font_family = Rajdhani Bold
    position = 203, 170
    halign = center
    valign = center
}

label {  # minute ones = 9
    monitor =
    text = cmd[update:1000] ~/.config/hypr/Scripts/clock.sh 4 9
    color = rgba($c_secondary, 1)
    font_size = 160
    font_family = Rajdhani Bold
    position = 204, 170
    halign = center
    valign = center
}

# ── AM/PM — under the seconds (same invisible 88:88 frame as the clock) ──
label {
    monitor =
    text = cmd[update:1000] ~/.config/hypr/Scripts/clock.sh ampm
    color = rgba($c_secondary, 1)
    font_size = 160
    font_family = Rajdhani Bold
    position = 27, 170
    halign = center
    valign = center
}

# ── Date ──
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A  //  %d %B %Y")"
    color = rgba($c_secondary, 0.55)
    font_size = 20
    font_family = Rajdhani Bold
    position = 0, 45
    halign = center
    valign = center
}

# ── Separator ──
label {
    monitor =
    text = ──────────────────── ◆ ────────────────────
    color = rgba($c_secondary, 0.15)
    font_size = 10
    font_family = JetBrainsMono Nerd Font Mono
    position = 0, 5
    halign = center
    valign = center
}

# ── Username — starts at the clock's left edge (x = -249; "neo" is 57 px wide) ──
label {
    monitor =
    text = $USER
    color = rgba($c_primary, 0.95)
    font_size = 28
    font_family = Rajdhani Bold
    position = -223, -45
    halign = center
    valign = center
}

# ── User role tag ──
label {
    monitor =
    text = SAMURAI
    color = rgba($c_tertiary, 0.5)
    font_size = 12
    font_family = JetBrainsMono Nerd Font Mono
    position = -223, -78
    halign = center
    valign = center
}

# ── Input Field — 24 px after the username, ends at the clock's right edge (x = +249) ──
input-field {
    monitor =
    size = 419, 55
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.25
    dots_center = true
    outer_color = rgba($c_primary, 0.8)
    inner_color = rgba($c_bg, 0.85)
    font_color = rgba($c_secondary, 1)
    fade_on_empty = false
    font_family = Rajdhani Bold
    placeholder_text = <i><span foreground="$x_primary">▸ ACCESS_REQUIRED</span></i>
    hide_input = false
    check_color = rgba($c_accent, 0.8)
    fail_color = rgba($c_primary, 1)
    fail_text = <i><span foreground="$x_primary">✘ ACCESS_DENIED</span></i>
    capslock_color = rgba($c_accent, 1)
    numlock_color = rgba($c_tertiary, 0.8)
    bothlock_color = rgba($c_primary, 1)
    position = 39, -60
    halign = center
    valign = center
    rounding = 3
}

# ══════════════════════════════════════════════════════════════════════════
#   BOTTOM DOCK — left: now playing · right: system controls
# ══════════════════════════════════════════════════════════════════════════

# ── Dock headers ──
label {
    monitor =
    text = cmd[update:1000] echo "┌── $(~/.config/hypr/Scripts/songdetail.sh header) ─────────────────"
    color = rgba($c_secondary, 0.35)
    font_size = 12
    font_family = JetBrainsMono Nerd Font Mono
    position = 80, 215
    halign = left
    valign = bottom
}

label {
    monitor =
    text = ───────────────── SYS.CTRL ──┐
    color = rgba($c_primary, 0.4)
    font_size = 12
    font_family = JetBrainsMono Nerd Font Mono
    position = -80, 215
    halign = right
    valign = bottom
}

# ── Media: cover (always 16:9, see Scripts/cover-frame.py) ──
image {
    monitor =
    path = /tmp/hyprlock-art/empty.png
    size = 130
    rounding = 10
    border_size = 3
    border_color = rgba($c_primary, 0.5)
    position = 100, 60
    halign = left
    valign = bottom
    reload_time = 2
    reload_cmd = ~/.config/hypr/Scripts/album-art.sh
}

# ── Media: title (player + play/pause icon) — click to play/pause ──
#    With nothing playing these three lines show HOST info instead
#    (hostname / kernel / uptime) — see Scripts/songdetail.sh
label {
    monitor =
    text = cmd[update:1000] echo "$(~/.config/hypr/Scripts/songdetail.sh icon)  $(~/.config/hypr/Scripts/songdetail.sh title)"
    color = rgba($c_primary, 0.95)
    font_size = 22
    font_family = Rajdhani Bold
    position = 360, 150
    halign = left
    valign = bottom
    onclick = playerctl -p "$(~/.config/hypr/Scripts/active-player.sh)" play-pause
}

# ── Media: artist ──
label {
    monitor =
    text = cmd[update:1000] echo "$(~/.config/hypr/Scripts/songdetail.sh artist)"
    color = rgba($c_text, 0.7)
    font_size = 16
    font_family = Rajdhani Bold
    position = 360, 115
    halign = left
    valign = bottom
}

# ── Media: player ──
label {
    monitor =
    text = cmd[update:1000] echo "<span letter_spacing='2048'>$(~/.config/hypr/Scripts/songdetail.sh player_name | tr '[:lower:]' '[:upper:]')</span>"
    color = rgba($c_primary, 0.9)
    font_size = 13
    font_family = JetBrainsMono Nerd Font Mono
    position = 360, 82
    halign = left
    valign = bottom
}

# ── System controls: 2 × 2 grid, each column left-aligned ──
# hyprlock places right-aligned labels by their right edge, so each item's x is
# (column left edge + its own width). Widths measured with pango at 18pt:
# SLEEP 96, REBOOT 110 | LOGOUT 107, SHUTDOWN 141 px. Column left edges:
# x = -410 and x = -241 from the right side of the screen.
label {
    monitor =
    text = 󰒲   SLEEP
    color = rgba($c_primary, 0.85)
    font_size = 18
    font_family = Rajdhani Bold
    position = -314, 140
    halign = right
    valign = bottom
    onclick = systemctl suspend
}

label {
    monitor =
    text = 󰍃   LOGOUT
    color = rgba($c_primary, 0.85)
    font_size = 18
    font_family = Rajdhani Bold
    position = -134, 140
    halign = right
    valign = bottom
    onclick = uwsm stop
}

label {
    monitor =
    text = 󰑓   REBOOT
    color = rgba($c_primary, 0.85)
    font_size = 18
    font_family = Rajdhani Bold
    position = -300, 85
    halign = right
    valign = bottom
    onclick = systemctl reboot
}

label {
    monitor =
    text = 󰐥   SHUTDOWN
    color = rgba($c_primary, 0.85)
    font_size = 18
    font_family = Rajdhani Bold
    position = -100, 85
    halign = right
    valign = bottom
    onclick = systemctl poweroff
}

# ══════════════════════════════════════════════════════════════════════════
#   BOTTOM — Data feed ticker + corner brackets
# ══════════════════════════════════════════════════════════════════════════

label {
    monitor =
    text = cmd[update:10000] echo "▸ $(~/.config/hypr/Scripts/cyber-datafeed.sh)"
    color = rgba($c_tertiary, 0.35)
    font_size = 11
    font_family = JetBrainsMono Nerd Font Mono
    position = 0, 8
    halign = center
    valign = bottom
}

label {
    monitor =
    text = ┌─
    color = rgba($c_primary, 0.25)
    font_size = 16
    font_family = JetBrainsMono Nerd Font Mono
    position = 40, -30
    halign = left
    valign = top
}

label {
    monitor =
    text = ─┐
    color = rgba($c_primary, 0.25)
    font_size = 16
    font_family = JetBrainsMono Nerd Font Mono
    position = -40, -30
    halign = right
    valign = top
}

label {
    monitor =
    text = └─
    color = rgba($c_secondary, 0.2)
    font_size = 16
    font_family = JetBrainsMono Nerd Font Mono
    position = 40, 10
    halign = left
    valign = bottom
}

label {
    monitor =
    text = ─┘
    color = rgba($c_secondary, 0.2)
    font_size = 16
    font_family = JetBrainsMono Nerd Font Mono
    position = -40, 10
    halign = right
    valign = bottom
}
