general {
    lock_cmd = pidof hyprlock || hyprlock                                     # avoid starting multiple hyprlock instances.
    before_sleep_cmd = loginctl lock-session                                  # lock before suspend.
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'  # to avoid having to press a key twice to turn on the display.
}
# Start screensaver after 2.5 minutes
listener {
    timeout = 150
    on-timeout = [ -f /tmp/caffeine.lock ] || pidof hyprlock || ([ -f /tmp/custom-screensaver.lock ] && kill -0 $(cat /tmp/custom-screensaver.lock 2>/dev/null) 2>/dev/null) || xdg-terminal-exec --title=custom-screensaver $HOME/.config/screensaver/play.sh
    # Guard logic:
    #   1. Skip if hyprlock is running (system is locked)
    #   2. Skip if lockfile exists AND the PID inside is alive (screensaver running)
    #   3. Otherwise launch — stale lockfiles from dead PIDs are ignored
    # NOTE: no on-resume needed. play.sh self-exits on keystroke, focus loss,
    # or hyprlock start. The trap + flock in play.sh handles cleanup.
}

Lock system after 5 minutes (screensaver resets idle timer, so have to just do half + 2s margin)
listener {
    timeout = 152
    on-timeout = [ -f /tmp/caffeine.lock ] || loginctl lock-session
}

