general {
    lock_cmd = omarchy-lock-screen                 # your custom lock script
    before_sleep_cmd = loginctl lock-session       # ensure it's locked before suspend
    after_sleep_cmd = hyprctl dispatch dpms on     # wake up display on resume
}

# 1. Screensaver / Lock Phase (3 minutes)
# We use 'pidof' to ensure we don't try to launch it if it's already running.
listener {
    timeout = 180                                
    on-timeout = pidof hyprlock || omarchy-launch-screensaver 
}

# 2. Hard Lock (3.5 minutes)
# This ensures the session is officially "locked" for 1Password/Security.
listener {
    timeout = 210                                
    on-timeout = loginctl lock-session           
}

# 3. Monitor Power Off (5 minutes)
# This is where you actually save power since hardware dimming isn't an option.
listener {
    timeout = 300                                
    on-timeout = hyprctl dispatch dpms off       
    on-resume = hyprctl dispatch dpms on         
}

# 4. Keyboard Backlight (5 minutes)
# (Assuming your keyboard is internal or USB-HID compatible with brightnessctl)
listener {
    timeout = 300                                
    on-timeout = brightnessctl -sd '*::kbd_backlight' set 0
    on-resume = brightnessctl -rd '*::kbd_backlight'
}

# 5. Suspend (20 minutes)
listener {
    timeout = 1200                               
    on-timeout = systemctl suspend
}
